<div id="ckz-puzzle-game-mvs6agq2ws9hvm" class="ckz-puzzle-game-root">
<style>
#ckz-puzzle-game-mvs6agq2ws9hvm{
  --puz-bg:#3f1559;
  --puz-board:#7c4094;
  --puz-gap:3px;
  --puz-rad:8px;
  --puz-mw:800px;
  --puz-size:5;
  width:100%;
  min-height:680px;
  position:relative;
  isolation:isolate;
  overflow:hidden;
  box-sizing:border-box;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(14px,3vw,24px);
  background:var(--puz-bg);
  color:#fff;
  font-family:inherit;
  line-height:1.4;
  border-radius:20px;
}
#ckz-puzzle-game-mvs6agq2ws9hvm *,
#ckz-puzzle-game-mvs6agq2ws9hvm *::before,
#ckz-puzzle-game-mvs6agq2ws9hvm *::after{box-sizing:border-box}
#ckz-puzzle-game-mvs6agq2ws9hvm button{font:inherit}
#ckz-puzzle-game-mvs6agq2ws9hvm button:focus,
#ckz-puzzle-game-mvs6agq2ws9hvm button:focus-visible,
#ckz-puzzle-game-mvs6agq2ws9hvm button:active{outline:none}
#ckz-puzzle-game-mvs6agq2ws9hvm:fullscreen{
  width:100vw;
  min-height:100vh;
  border-radius:0;
  overflow:auto;
  padding:20px;
}
#ckz-puzzle-game-mvs6agq2ws9hvm .puz-shell{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px;
}
#ckz-puzzle-game-mvs6agq2ws9hvm .puz-controls{
  width:min(100%,var(--puz-mw));
  display:flex;
  justify-content:flex-end;
}
#ckz-puzzle-game-mvs6agq2ws9hvm .puz-btn{
  min-height:44px;
  border:1px solid rgba(255,255,255,.4);
  border-radius:8px;
  padding:10px 15px;
  background:rgba(255,255,255,.2);
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  backdrop-filter:blur(5px);
  transition:background .2s ease,transform .15s ease;
}
#ckz-puzzle-game-mvs6agq2ws9hvm .puz-btn:hover{background:rgba(255,255,255,.3)}
#ckz-puzzle-game-mvs6agq2ws9hvm .puz-btn:active{transform:scale(.98)}
#ckz-puzzle-game-mvs6agq2ws9hvm .puz-board{
  width:min(92vw,100%);
  max-width:var(--puz-mw);
  aspect-ratio:1/1;
  display:grid;
  grid-template-columns:repeat(var(--puz-size),1fr);
  gap:var(--puz-gap);
  padding:var(--puz-gap);
  border-radius:calc(var(--puz-rad) + var(--puz-gap));
  background:var(--puz-board);
  box-shadow:0 20px 50px rgba(0,0,0,.5);
}
#ckz-puzzle-game-mvs6agq2ws9hvm .puz-tile{
  border:0;
  padding:0;
  border-radius:var(--puz-rad);
  background-repeat:no-repeat;
  cursor:pointer;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  transition:transform .1s ease;
}
#ckz-puzzle-game-mvs6agq2ws9hvm .puz-tile:active{transform:scale(.95)}
#ckz-puzzle-game-mvs6agq2ws9hvm .puz-tile.puz-empty{
  background:transparent!important;
  cursor:default;
  transform:none!important;
  pointer-events:none;
}
#ckz-puzzle-game-mvs6agq2ws9hvm .puz-win{
  position:absolute;
  inset:0;
  z-index:20;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:22px;
  padding:20px;
  background:rgba(0,0,0,.86);
  text-align:center;
}
#ckz-puzzle-game-mvs6agq2ws9hvm .puz-win h2{
  margin:0;
  padding:0 20px;
  color:#f1c40f;
  font-size:clamp(1.8rem,5vw,2.5rem);
  line-height:1.2;
}
#ckz-puzzle-game-mvs6agq2ws9hvm .puz-restart{
  min-width:180px;
  background:#fff;
  color:#111;
  border-color:#fff;
}
@media(max-width:600px){
  #ckz-puzzle-game-mvs6agq2ws9hvm{
    min-height:540px;
    padding:10px;
    border-radius:14px;
  }
  #ckz-puzzle-game-mvs6agq2ws9hvm .puz-controls{justify-content:center}
  #ckz-puzzle-game-mvs6agq2ws9hvm .puz-btn{width:100%}
}
@media(prefers-reduced-motion:reduce){
  #ckz-puzzle-game-mvs6agq2ws9hvm *,
  #ckz-puzzle-game-mvs6agq2ws9hvm *::before,
  #ckz-puzzle-game-mvs6agq2ws9hvm *::after{
    animation-duration:.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:.01ms!important;
    scroll-behavior:auto!important;
  }
}
</style>

<script type="application/json" data-puzzle-message>"Вы собрали часть витража!"</script>
<script type="application/json" data-puzzle-maxwidth>"800px"</script>
<script type="application/json" data-puzzle-bg>"#3f1559"</script>
<script type="application/json" data-puzzle-board>"#7c4094"</script>

<div class="puz-shell">
  <div class="puz-controls">
    <button type="button" class="puz-btn" data-action="fullscreen">⛶ На весь экран</button>
  </div>

  <div class="puz-board" data-board aria-label="Игра Пятнашки"></div>
</div>

<div class="puz-win" data-win aria-hidden="true">
  <h2 data-win-text></h2>
  <button type="button" class="puz-btn puz-restart" data-action="restart">Играть ещё</button>
</div>

<script>
(function(){
  'use strict';

  const root = document.getElementById('ckz-puzzle-game-mvs6agq2ws9hvm');
  if (!root || root.dataset.initialized === 'true') return;
  root.dataset.initialized = 'true';

  const q = (selector) => root.querySelector(selector);

  function readJson(selector, fallback) {
    const node = q(selector);
    if (!node) return fallback;
    try {
      return JSON.parse(node.textContent);
    } catch (error) {
      return fallback;
    }
  }

  const image = readJson('[data-puzzle-image]', '');
  const winMessage = readJson('[data-puzzle-message]', 'Отлично сыграно!');
  const sz = 5;

  const board = q('[data-board]');
  const win = q('[data-win]');
  const winText = q('[data-win-text]');
  const btnFullscreen = q('[data-action="fullscreen"]');
  const btnRestart = q('[data-action="restart"]');

  let tiles = [];
  let locked = false;

  winText.textContent = winMessage;

  function makeSolvedState() {
    tiles = [];
    for (let i = 0; i < sz * sz; i++) tiles.push(i);
  }

  function shuffleFromSolved() {
    makeSolvedState();

    let emptyIndex = sz * sz - 1;

    for (let i = 0; i < 300; i++) {
      const moves = [];
      const row = Math.floor(emptyIndex / sz);
      const col = emptyIndex % sz;

      if (row > 0) moves.push(emptyIndex - sz);
      if (row < sz - 1) moves.push(emptyIndex + sz);
      if (col > 0) moves.push(emptyIndex - 1);
      if (col < sz - 1) moves.push(emptyIndex + 1);

      const moveIndex = moves[Math.floor(Math.random() * moves.length)];
      [tiles[emptyIndex], tiles[moveIndex]] = [tiles[moveIndex], tiles[emptyIndex]];
      emptyIndex = moveIndex;
    }

    /* Крайне маловероятно, но не начинаем с уже собранного поля. */
    if (tiles.every((value, index) => value === index)) {
      shuffleFromSolved();
    }
  }

  function isSolved() {
    return tiles.every((value, index) => value === index);
  }

  function draw() {
    board.replaceChildren();
    const bgPosPer = sz > 1 ? 100 / (sz - 1) : 0;

    tiles.forEach((value, index) => {
      const empty = value === sz * sz - 1;
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'puz-tile' + (empty ? ' puz-empty' : '');

      if (!empty) {
        const originalRow = Math.floor(value / sz);
        const originalCol = value % sz;
        tile.style.backgroundImage = 'url("' + image.replace(/"/g, '%22') + '")';
        tile.style.backgroundPosition = (originalCol * bgPosPer) + '% ' + (originalRow * bgPosPer) + '%';
        tile.style.backgroundSize = (sz * 100) + '% ' + (sz * 100) + '%';
        tile.setAttribute('aria-label', 'Переместить фрагмент ' + (value + 1));
        tile.addEventListener('pointerdown', function(event) {
          event.preventDefault();
          move(index);
        });
      } else {
        tile.disabled = true;
        tile.setAttribute('aria-hidden', 'true');
      }

      board.appendChild(tile);
    });

    if (isSolved() && !locked) {
      locked = true;
      setTimeout(showWin, 300);
    }
  }

  function move(index) {
    if (locked) return;

    const emptyIndex = tiles.indexOf(sz * sz - 1);
    const row = Math.floor(index / sz);
    const col = index % sz;
    const emptyRow = Math.floor(emptyIndex / sz);
    const emptyCol = emptyIndex % sz;

    if (Math.abs(row - emptyRow) + Math.abs(col - emptyCol) !== 1) return;

    [tiles[index], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[index]];
    draw();
  }

  function showWin() {
    win.style.display = 'flex';
    win.setAttribute('aria-hidden', 'false');
  }

  function startGame() {
    locked = false;
    win.style.display = 'none';
    win.setAttribute('aria-hidden', 'true');
    shuffleFromSolved();
    draw();
  }

  async function toggleFullscreen() {
    try {
      if (document.fullscreenElement === root) {
        if (document.exitFullscreen) await document.exitFullscreen();
      } else if (root.requestFullscreen) {
        await root.requestFullscreen();
      }
    } catch (error) {
      /* Fullscreen API недоступен — игра продолжает работать. */
    }
  }

  btnRestart.addEventListener('click', startGame);
  btnFullscreen.addEventListener('click', toggleFullscreen);

  startGame();
})();
</script>
</div>
